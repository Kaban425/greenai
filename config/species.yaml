    name: "Липа мелколистная"
    latin: "Tilia cordata"
    genus: Tilia
    family: Malvaceae
    crown_m: 8.0
    height_m: 15.0
    shade_tolerance: medium
    salt_tolerance: medium
    note: "Обхват ствола 16-18 см, ком 0,9х0,6 м"
