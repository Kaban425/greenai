# Каталог пород. Ассортимент взят из дендропланов реальных проектов
# (ул. Берзарина, Песчаный переулок) — то, что проходит согласование в Москве.
#
# crown_m  — диаметр кроны взрослого растения, задаёт интервал посадки
# genus / family — нужны для правила 10-20-30: не более 10% одного вида,
#   20% рода и 30% семейства. Правило защищает от массовой гибели насаждений
#   при вспышке вредителя или болезни; именно из-за его несоблюдения
#   на улицах Москвы стареют однотипные посадки тополя и ясеня.
# shade_tolerance / salt_tolerance — low | medium | high

trees:
