  kind: tree
  group: хвойное
  allowed:
    yard: true
    preschool: true
    school: true
    health: true
    highway: false
    square: true
    park: true
    industrial: true
  notes:
  - 'Требует особого ухода: защита корневой системы от травм, весеннее дождевание кроны (при посадке у
    дорог), мульчирование, рыхление'
  - Требует дренированных, рыхлых, незасоленных, неуплотнённых почв. Не высаживать в зонах с застойным
    увлажнением и на уплотнённых грунтах
  - Чувствительно к противогололёдным реагентам и выхлопным газам
  source: основной
