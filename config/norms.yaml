# Справочник нормативных отступов.
# distance — минимальное расстояние ОТ объекта ДО ЦЕНТРА СТВОЛА, метры.
# null = посадка данного типа рядом с объектом не допускается.
# act / clause попадают в объяснение к каждой посадке.
# Значения таблицы 9.1 СП 42.13330.2016 совпадают с таблицей 3.6.1 Правил
# создания, содержания и охраны зелёных насаждений (ППМ № 743-ПП, прил. 1,
# п. 3.6.3, со ссылкой на МГСН 1.01-99); п. 4.2.4 МГСН 1.02-02 (ППМ № 623-ПП)
# требует обеспечивать эти расстояния при проектировании озеленения.
# Сверено с официальным текстом 743-ПП на mos.ru, 2026-09-28.

version: "1.0"

rules:
  building:
    title: "Наружная стена здания и сооружения"
    tree: 5.0
    shrub: 1.5
    act: "СП 42.13330.2016"
    clause: "таблица 9.1; ППМ № 743-ПП, прил. 1, п. 3.6.3, табл. 3.6.1 (МГСН 1.01-99); ППМ № 623-ПП (МГСН 1.02-02), п. 4.2.4"
  school_kindergarten:
    title: "Наружная стена школы или детского сада"
    tree: 10.0
    shrub: 1.5
    act: "СП 42.13330.2016"
    clause: "таблица 9.1; ППМ № 743-ПП, прил. 1, п. 3.6.3, табл. 3.6.1 (МГСН 1.01-99); ППМ № 623-ПП (МГСН 1.02-02), п. 4.2.4"
  walkway:
    title: "Край тротуара и садовой дорожки"
    tree: 0.7
    shrub: 0.5
    act: "СП 42.13330.2016"
    clause: "таблица 9.1; ППМ № 743-ПП, прил. 1, п. 3.6.3, табл. 3.6.1 (МГСН 1.01-99); ППМ № 623-ПП (МГСН 1.02-02), п. 4.2.4"
  road:
    title: "Край проезжей части, кромка укреплённой полосы обочины"
    tree: 2.0
    shrub: 1.0
    act: "СП 42.13330.2016"
    clause: "таблица 9.1; ППМ № 743-ПП, прил. 1, п. 3.6.3, табл. 3.6.1 (МГСН 1.01-99); ППМ № 623-ПП (МГСН 1.02-02), п. 4.2.4"
  lighting_pole:
    title: "Мачта и опора осветительной сети, колонна галереи или эстакады"
    tree: 4.0
    shrub: null
    act: "СП 42.13330.2016"
    clause: "таблица 9.1; ППМ № 743-ПП, прил. 1, п. 3.6.3, табл. 3.6.1 (МГСН 1.01-99); ППМ № 623-ПП (МГСН 1.02-02), п. 4.2.4"
  retaining_wall:
    title: "Подошва или внутренняя грань подпорной стенки"
    tree: 3.0
    shrub: 1.0
    act: "СП 42.13330.2016"
    clause: "таблица 9.1; ППМ № 743-ПП, прил. 1, п. 3.6.3, табл. 3.6.1 (МГСН 1.01-99); ППМ № 623-ПП (МГСН 1.02-02), п. 4.2.4"
  slope:
    title: "Подошва откоса, террасы"
    tree: 1.0
    shrub: 0.5
    act: "СП 42.13330.2016"
    clause: "таблица 9.1; ППМ № 743-ПП, прил. 1, п. 3.6.3, табл. 3.6.1 (МГСН 1.01-99); ППМ № 623-ПП (МГСН 1.02-02), п. 4.2.4"
  tram:
    title: "Ось трамвайных путей"
    tree: 5.0
    shrub: 3.0
    act: "СП 42.13330.2016"
    clause: "таблица 9.1; ППМ № 743-ПП, прил. 1, п. 3.6.3, табл. 3.6.1 (МГСН 1.01-99); ППМ № 623-ПП (МГСН 1.02-02), п. 4.2.4"
  gas:
    title: "Газопровод"
    tree: 1.5
    shrub: null
    act: "СП 42.13330.2016"
    clause: "таблица 9.1; ППМ № 743-ПП, прил. 1, п. 3.6.3, табл. 3.6.1 (МГСН 1.01-99); ППМ № 623-ПП (МГСН 1.02-02), п. 4.2.4"
  sewer:
    title: "Канализация"
    tree: 1.5
    shrub: null
    act: "СП 42.13330.2016"
    clause: "таблица 9.1; ППМ № 743-ПП, прил. 1, п. 3.6.3, табл. 3.6.1 (МГСН 1.01-99); ППМ № 623-ПП (МГСН 1.02-02), п. 4.2.4"
  heating:
    title: "Тепловая сеть (стенка канала, тоннеля, оболочка при бесканальной прокладке)"
    tree: 2.0
    shrub: 1.0
    act: "СП 42.13330.2016"
    clause: "таблица 9.1; ППМ № 743-ПП, прил. 1, п. 3.6.3, табл. 3.6.1 (МГСН 1.01-99); ППМ № 623-ПП (МГСН 1.02-02), п. 4.2.4"
  water:
    title: "Водопровод, дренаж"
    tree: 2.0
    shrub: null
    act: "СП 42.13330.2016"
    clause: "таблица 9.1; ППМ № 743-ПП, прил. 1, п. 3.6.3, табл. 3.6.1 (МГСН 1.01-99); ППМ № 623-ПП (МГСН 1.02-02), п. 4.2.4"
  power_cable:
    title: "Силовой кабель и кабель связи"
    tree: 2.0
    shrub: 0.7
    act: "СП 42.13330.2016"
    clause: "таблица 9.1; ППМ № 743-ПП, прил. 1, п. 3.6.3, табл. 3.6.1 (МГСН 1.01-99); ППМ № 623-ПП (МГСН 1.02-02), п. 4.2.4"
  utility:
    # Подземная коммуникация без указания вида. Встречается на слоях
    # «Подземные коммуникации», «Трубопроводы проектные» и на файлах
    # выгрузки с суффиксом up и pp. Вид неизвестен, поэтому берём
    # наибольший из типовых отступов таблицы 9.1 — как от водопровода.
    title: "Подземная коммуникация (вид не указан)"
    tree: 2.0
    shrub: 0.7
    act: "СП 42.13330.2016"
    clause: "таблица 9.1; ППМ № 743-ПП, прил. 1, п. 3.6.3, табл. 3.6.1 (МГСН 1.01-99); ППМ № 623-ПП (МГСН 1.02-02), п. 4.2.4 — по наибольшему отступу для подземных сетей"

  power_line:
    # Воздушная линия электропередачи. Крона не должна попадать в габарит
    # провода: обрезка под проводами калечит дерево, а касание опасно.
    # Ширина охранной зоны зависит от напряжения (Правила установления
    # охранных зон объектов электросетевого хозяйства), здесь взято
    # значение для линий до 1 кВ.
    title: "Воздушная линия электропередачи"
    tree: 2.0
    shrub: 1.0
    act: "Постановление Правительства РФ № 160 от 24.02.2009"
    clause: "охранная зона ВЛ до 1 кВ — 2 м от крайнего провода"

  furniture:
    # Скамьи, урны, ограждения, велопарковки. Нормативного отступа нет,
    # но посадка вплотную мешает обслуживанию и самому элементу.
    title: "Малые архитектурные формы, ограждения"
    tree: 1.5
    shrub: 0.5
    act: "Проектное допущение"
    clause: "сохранение доступа и функции элемента благоустройства"

  well:
    # Смотровые колодцы и дождеприёмники: таблица 9.1 отступ от них не
    # нормирует, но посадка в сам колодец невозможна и доступ к нему
    # должен сохраняться для обслуживания.
    title: "Смотровой колодец, дождеприёмник"
    tree: 1.5
    shrub: 0.7
    act: "Проектное допущение"
    clause: "сохранение доступа к колодцу для обслуживания"

  existing_tree:
    # Расстояние между стволами таблицей 9.1 не нормируется: она задаёт
    # отступы от зданий и сетей. Значение — проектное допущение по смыканию
    # крон, меняется под конкретный ассортимент.
    title: "Существующее сохраняемое дерево (от ствола)"
    tree: 4.0
    shrub: 1.0
    act: "Проектное допущение"
    clause: "смыкание крон, сохранение насаждений по ППМ № 743-ПП"

placement:
  # Шаг рядовой посадки: ППМ № 743-ПП, прил. 1, п. 3.6.4, табл. 3.6.2 —
  # на магистралях 5-6 м при однорядной посадке, 7-8 м при двухрядной,
  # 5-7 м в группах. Посадочные планы пилота это подтверждают: медиана
  # расстояния до соседнего дерева 6,0 м (Камчатская), 7,0 м (Наташинский).
  # Раньше стояло 10 м — реже и нормы, и практики (сверка 2026-09-28).
  tree_spacing_m: 6.0
  shrub_spacing_m: 0.6
  boundary_margin_m: 0.3
  grid_step_m: 1.0
  # Плотность посадки. Ограничивает алгоритм сверху, чтобы он не заполнял
  # деревьями всю допустимую зону. Для справки: реальный проект
  # "Песчаный переулок" — 33 дерева на 1,7 га, то есть около 19 шт/га.
  target_trees_per_ha: 0
  # Стратегия размещения:
  #   row    — рядовая посадка по осевой линии зелёной полосы (как в практике)
  #   street — отбор точек по оценке места, с тяготением к проезжей части
  #   grove  — равномерное заполнение зоны (сквер, массив)
  #   mixed  — компромисс
  mode: row
  # Примечание к таблице 9.1: нормы даны для деревьев с диаметром кроны
  # до 5 м и должны увеличиваться для более крупных крон. Формулы примечание
  # не содержит, поэтому линейный коэффициент (крона / 5 м) — наша
  # интерпретация, а не норматив. По умолчанию выключено: сверка с реальным
  # проектом показала, что проектировщики применяют табличные значения как
  # есть. Включается ключом --crown-correction.
  crown_correction: false
  crown_base_m: 5.0

  # Прочерк в таблице 9.1 = норма не установлена, а не запрет.
  # Для кустарника над подземной сетью закладываем технологическую полосу
  # обслуживания. Это проектное допущение, в отчёте помечается как допущение.
  network_service_buffer_m: 1.0

# Сценарии расчёта.
# strict — буквальное соблюдение таблицы 9.1, без дополнительных мероприятий.
# root_barrier — с устройством корнезащитного экрана (корнебарьера).
#   Приём применяется в московской практике: экран глубиной 60-90 см не даёт
#   корням дойти до сети. Отступ сокращается ТОЛЬКО по согласованию с
#   владельцем сети, поэтому в отчёте помечается как проектное допущение.
#   Газопровод и теплосеть не смягчаются: риск аварии несопоставим.
scenarios:
  strict:
    title: "Строгое соблюдение таблицы 9.1"
    overrides: {}
  root_barrier:
    title: "С устройством корнезащитного экрана"
    note: "Требует согласования с владельцем сети"
    overrides:
      power_cable: {tree: 1.0, shrub: 0.5}
      water: {tree: 1.0, shrub: 0.7}
      sewer: {tree: 1.0, shrub: 0.7}
  # practice — НЕ НОРМАТИВ. Отступы, с которыми фактически посажены деревья
  #   в проекте ул. Берзарина (посадочный план, 363 дерева, сверка 2026-09-28):
  #   медиана до кабеля 1,1 м, до существующего дерева 2,6 м, до борта 2,3 м;
  #   десятая часть деревьев стоит ближе 1,6 м к борту. Нужен, чтобы сравнивать
  #   расчёт с решениями проектировщиков. Каждое такое сближение требует
  #   обоснования: перекладки сети в футляр, согласования с владельцем.
  practice:
    title: "Практика проектов пилота (не норматив)"
    note: "Отступы по фактическим посадкам проекта ул. Берзарина; требует согласований"
    overrides:
      power_cable: {tree: 1.0, shrub: 0.5}
      water: {tree: 1.0, shrub: 0.7}
      sewer: {tree: 1.0, shrub: 0.7}
      road: {tree: 1.5, shrub: 0.8}
      existing_tree: {tree: 2.5, shrub: 1.0}
