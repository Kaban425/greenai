# Знания для выбора места посадки, когда обученной модели нет или она
# отключена. Веса — относительная важность условий, сумма любая:
# они нормируются. Правятся на странице «Модель посадки».
root_space: 0.40     # объём для корней: дальше от асфальта и плитки
insolation: 0.25     # освещённость: меньше тени от зданий
comfort:    0.20     # польза людям: тень на тротуаре в 2-5 м от дорожки
drainage:   0.15     # водный режим: близость к ливневой сети

# Предпочтения размещения
spacing_m: 6.0       # шаг между стволами: 743-ПП табл. 3.6.2 — 5-6 м в ряд
fill_remaining: true # досаживать всю оставшуюся допустимую площадь
